[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aifr"
version = "0.6.0"
description = "AIFR V14 cafeteria multi-robot navigation, orders, traffic coordination and live Blender control"
requires-python = ">=3.10"
dependencies = []            # runtime: standard library only

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["aifr"]
